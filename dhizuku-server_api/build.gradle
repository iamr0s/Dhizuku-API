plugins {
    alias(libs.plugins.agp.lib)
    id('maven-publish')
    id('signing')
}

def signingProps = new Properties()
def signingFile = file("${rootDir}/keystore/signing.properties")
if (signingFile.exists()) {
    signingProps.load(signingFile.newInputStream())
}

android {
    namespace = 'com.rosan.dhizuku.server_api'
    compileSdk = rootProject.TARGET_SDK

    enableKotlin = false

    defaultConfig {
        minSdk = rootProject.MIN_SDK
        targetSdk = rootProject.TARGET_SDK

        buildConfigField 'String', 'SERVICE_VERSION_NAME', "\"${rootProject.SERVER_API_VERSION}\""

        consumerProguardFiles 'consumer-rules.pro'
    }

    buildFeatures {
        buildConfig = true
        aidl = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

dependencies {
    implementation(libs.app.process)
    api project(':dhizuku-api')
    compileOnly project(':hidden-api')
}

publishing {
    publications {
        mavenRelease(MavenPublication) {
            afterEvaluate {
                from components.findByName('release')
            }

            group = rootProject.GROUP_ID
            artifactId = rootProject.SERVER_API_ARTIFACT_ID
            version = rootProject.SERVER_API_VERSION

            pom {
                name = rootProject.SERVER_API_POM_NAME
                description = rootProject.SERVER_API_POM_DESCRIPTION
                inceptionYear = rootProject.POM_INCEPTION_YEAR
                url = rootProject.POM_URL
                scm {
                    url = rootProject.POM_SCM_URL
                    connection = rootProject.POM_SCM_CONNECTION
                }
                licenses {
                    license {
                        name = rootProject.POM_LICENSE_NAME
                        url = rootProject.POM_LICENSE_URL
                    }
                }
                developers {
                    developer {
                        name = rootProject.POM_DEVELOPER_NAME
                        url = rootProject.POM_DEVELOPER_URL
                    }
                }
            }
        }
    }
    repositories {
        maven {
            url = uri(rootProject.layout.buildDirectory.dir("staging").get().asFile)
        }
    }
}

signing {
    if (signingFile.exists()) {
        useInMemoryPgpKeys(
                file(signingProps['signing.secretKeyRingFile']).text,
                signingProps['signing.password']
        )
        sign publishing.publications
    }
}
