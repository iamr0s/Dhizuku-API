plugins {
    alias(libs.plugins.agp.lib)
    id('maven-publish')
    id('signing')
}

def signingProps = new Properties()
def signingFile = file("${rootDir}/keystore/signing.properties")
if (signingFile.exists()) {
    signingProps.load(signingFile.newInputStream())
}

android {
    namespace = 'com.rosan.dhizuku.api'
    compileSdk = rootProject.ext.TARGET_SDK

    enableKotlin = false

    defaultConfig {
        minSdk = rootProject.ext.MIN_SDK
        targetSdk = rootProject.ext.TARGET_SDK

        consumerProguardFiles 'consumer-rules.pro'
    }

    buildFeatures {
        buildConfig = true
        aidl = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

dependencies {
    compileOnly project(':hidden-api')
}

publishing {
    publications {
        mavenRelease(MavenPublication) {
            afterEvaluate {
                from components.findByName('release')
            }

            group = rootProject.ext.GROUP_ID
            artifactId = rootProject.ext.API_ARTIFACT_ID
            version = rootProject.ext.CLIENT_API_VERSION

            pom {
                name = rootProject.ext.API_POM_NAME
                description = rootProject.ext.API_POM_DESCRIPTION
                inceptionYear = rootProject.ext.POM_INCEPTION_YEAR
                url = rootProject.ext.POM_URL
                scm {
                    url = rootProject.ext.POM_SCM_URL
                    connection = rootProject.ext.POM_SCM_CONNECTION
                }
                licenses {
                    license {
                        name = rootProject.ext.POM_LICENSE_NAME
                        url = rootProject.ext.POM_LICENSE_URL
                    }
                }
                developers {
                    developer {
                        name = rootProject.ext.POM_DEVELOPER_NAME
                        url = rootProject.ext.POM_DEVELOPER_URL
                    }
                }
            }
        }
    }
    repositories {
        maven {
            url = uri(rootProject.layout.buildDirectory.dir("staging").get().asFile)
        }
    }
}

signing {
    if (signingFile.exists() && signingProps['signing.keyId'] != null) {
        def privateKey = signingProps['signing.privateKey']
        if (privateKey == null) {
            privateKey = file(signingProps['signing.secretKeyRingFile']).text
        }
        useInMemoryPgpKeys(
                signingProps['signing.keyId'],
                privateKey,
                signingProps['signing.password']
        )
        sign publishing.publications
    }
}
