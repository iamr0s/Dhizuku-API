plugins {
    alias(libs.plugins.agp.lib)
    id('maven-publish')
    id('signing')
}

def signingProps = new Properties()
def signingFile = file("${rootDir}/keystore/signing.properties")
if (signingFile.exists()) {
    signingProps.load(signingFile.newInputStream())
}

android {
    namespace = 'com.rosan.dhizuku.api'
    compileSdk = rootProject.ext.TARGET_SDK

    enableKotlin = false

    defaultConfig {
        minSdk = rootProject.ext.MIN_SDK
        targetSdk = rootProject.ext.TARGET_SDK

        consumerProguardFiles 'consumer-rules.pro'
    }

    buildFeatures {
        buildConfig = true
        aidl = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

dependencies {
    compileOnly project(':hidden-api')
}

publishing {
    publications {
        mavenRelease(MavenPublication) {
            afterEvaluate {
                from components.findByName('release')
            }

            group = 'io.github.iamr0s'
            artifactId = 'Dhizuku-API'
            version = rootProject.ext.CLIENT_API_VERSION

            pom {
                name = 'Dhizuku-API'
                description = 'API for Dhizuku'
                inceptionYear = '2024'
                url = 'https://github.com/iamr0s/Dhizuku-API'
                scm {
                    url = 'https://github.com/iamr0s/Dhizuku-API'
                    connection = 'scm:git:https://github.com/iamr0s/Dhizuku-API.git'
                }
                licenses {
                    license {
                        name = 'Apache-2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0'
                    }
                }
                developers {
                    developer {
                        name = 'iamr0s'
                        url = 'https://github.com/iamr0s'
                    }
                }
            }
        }
    }
    repositories {
        maven {
            url = uri(rootProject.layout.buildDirectory.dir("staging").get().asFile)
        }
    }
}

signing {
    if (signingFile.exists() && signingProps['signing.keyId'] != null) {
        def privateKey = signingProps['signing.privateKey']
        if (privateKey == null) {
            privateKey = file(signingProps['signing.secretKeyRingFile']).text
        }
        useInMemoryPgpKeys(
                signingProps['signing.keyId'],
                privateKey,
                signingProps['signing.password']
        )
        sign publishing.publications
    }
}
