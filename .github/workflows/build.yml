name: Build

on:
  push:
    paths-ignore:
      - 'docs/**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set environment
        run: |
          {
            echo "repo=$(echo ${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/})"
            echo "commit=$(echo ${{ github.sha }} | cut -c-7)"
            echo "client=$(grep CLIENT_API_VERSION build.gradle | awk -F\' '{print $2}')"
            echo "server=$(grep SERVER_API_VERSION build.gradle | awk -F\' '{print $2}')"
          } >> $GITHUB_ENV

      - name: Cache AppProcess API
        id: app_process-api
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/
          key: 202610270630JST

      - name: Checkout API
        if: steps.app_process-api.outputs.cache-hit != 'true'
        uses: actions/checkout@v6
        with:
          repository: iamr0s/AndroidAppProcess
          path: app_process

      - name: Build AppProcess
        if: steps.app_process-api.outputs.cache-hit != 'true'
        working-directory: app_process
        run: ./gradlew --no-daemon publishToMavenLocal

      - name: Build Dhizuku-API
        run: |
          ./gradlew --no-daemon --warning-mode=all assembleDebug
          cp dhizuku-server_api/build/outputs/aar/Dhizuku-SERVER_API-debug.aar "${{ env.repo }}_SERVER-${{ env.server }}@${{ env.commit }}.aar"
          cp dhizuku-api/build/outputs/aar/Dhizuku-API-debug.aar "${{ env.repo }}_CLIENT-${{ env.client }}@${{ env.commit }}.aar"

      - name: Upload (Server)
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: "${{ env.repo }}_SERVER-${{ env.server }}@${{ env.commit }}.aar"

      - name: Upload (Client)
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: "${{ env.repo }}_CLIENT-${{ env.client }}@${{ env.commit }}.aar"
