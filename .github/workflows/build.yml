name: Build

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - 'docs/**'
    tags-ignore:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set environment
        run: |
          {
            echo "client_name=$(grep CLIENT_API_ARTIFACT_ID build.gradle | awk -F\' '{print $2}')"
            echo "server_name=$(grep SERVER_API_ARTIFACT_ID build.gradle | awk -F\' '{print $2}')"
            echo "client_version=v$(grep CLIENT_API_VERSION build.gradle | awk -F\' '{print $2}')"
            echo "server_version=v$(grep SERVER_API_VERSION build.gradle | awk -F\' '{print $2}')"
            echo "commit=$(echo ${{ github.sha }} | cut -c-7)"
          } >> $GITHUB_ENV

      - name: Build
        run: |
          ./gradlew --warning-mode=all assembleDebug
          cp dhizuku-server_api/build/outputs/aar/dhizuku-server_api-debug.aar "${{ env.server_name }}-${{ env.server_version }}@${{ env.commit }}.aar"
          cp dhizuku-api/build/outputs/aar/dhizuku-api-debug.aar "${{ env.client_name }}-${{ env.client_version }}@${{ env.commit }}.aar"

      - name: Upload (Server)
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: "${{ env.server_name }}-${{ env.server_version }}@${{ env.commit }}.aar"

      - name: Upload (Client)
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: "${{ env.client_name }}-${{ env.client_version }}@${{ env.commit }}.aar"
