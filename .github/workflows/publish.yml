name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-24.04

    steps:
      - name: Check token status
        run: curl -sS --fail-with-body -u "${{ secrets.MAVEN_REPO_TOKEN }}" https://central.sonatype.com/api/v1/publisher/deployments -o /dev/null

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set environment
        run: |
          client_name="$(grep CLIENT_API_ARTIFACT_ID build.gradle| awk -F\' '{print $2}')"
          client_version="v$(grep CLIENT_API_VERSION build.gradle| awk -F\' '{print $2}')"
          server_name="$(grep SERVER_API_ARTIFACT_ID build.gradle| awk -F\' '{print $2}')"
          server_version="v$(grep SERVER_API_VERSION build.gradle| awk -F\' '{print $2}')"
          {
            echo "client_name=$client_name"
            echo "client_version=$client_version"
            echo "client_artifact=${client_name}-${client_version}"
            echo "server_name=$server_name"
            echo "server_version=$server_version"
            echo "server_artifact=${server_name}-${server_version}"
          } >> $GITHUB_ENV

      - name: Set signing config
        run: |
          printf '%s' '${{ secrets.GPG_KEY_FILE }}' > keystore/private.asc
          {
            echo "signing.secretKeyRingFile=$GITHUB_WORKSPACE/keystore/private.asc"
            echo "signing.password=${{ secrets.GPG_KEY_PASS }}"
          } > keystore/signing.properties

      - name: Build (Client)
        run: ./gradlew :dhizuku-api:publishMavenReleasePublicationToMavenRepository

      - name: Publish (Client)
        working-directory: build/staging
        run: |
          zip -r ${{ env.client_artifact }}.zip .
          curl -sS --fail-with-body -u "${{ secrets.MAVEN_REPO_TOKEN }}" -F "bundle=@${{ env.client_artifact }}.zip" "https://central.sonatype.com/api/v1/publisher/upload?name=${{ env.client_artifact }}&publishingType=AUTOMATIC"

      - name: Upload (Client)
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: build/staging/${{ env.client_artifact }}.zip

      - name: Cleanup
        run: rm -rf build

      - name: Build (Server)
        run: ./gradlew :dhizuku-server_api:publishMavenReleasePublicationToMavenRepository

      - name: Publish (Server)
        working-directory: build/staging
        run: |
          zip -r ${{ env.server_artifact }}.zip .
          curl -sS --fail-with-body -u "${{ secrets.MAVEN_REPO_TOKEN }}" -F "bundle=@${{ env.server_artifact }}.zip" "https://central.sonatype.com/api/v1/publisher/upload?name=${{ env.server_artifact }}&publishingType=AUTOMATIC"

      - name: Upload (Server)
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: build/staging/${{ env.server_artifact }}.zip
